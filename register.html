<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมัครสมาชิก | ระบบจัดการร้านสัตว์เลี้ยง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="wrap">
  <form class="card login" id="regForm">
    <h1 style="font-size:22px">🐶 สมัครสมาชิก</h1>
    <p class="mute">สร้างบัญชีเพื่อเข้าใช้ระบบจัดการร้านสัตว์เลี้ยง</p>
    <label for="n">ชื่อที่แสดง</label><input id="n" name="n" type="text" autocomplete="name" required>
    <label for="u">อีเมล</label><input id="u" name="u" type="email" autocomplete="username" required>
    <label for="p">รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label><input id="p" name="p" type="password" autocomplete="new-password" minlength="6" required>
    <label for="p2">ยืนยันรหัสผ่าน</label><input id="p2" name="p2" type="password" autocomplete="new-password" minlength="6" required>
    <div class="err" id="err" role="alert"></div>
    <div class="mute" id="ok" role="status" style="color:var(--ok)"></div>
    <button class="btn" style="width:100%">สมัครสมาชิก</button>
    <p class="mute" style="text-align:center">มีบัญชีอยู่แล้ว? <a href="login.html" style="color:var(--pri)">เข้าสู่ระบบ</a></p>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="register.js"></script>
</body>
</html>
